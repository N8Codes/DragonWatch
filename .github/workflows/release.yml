name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test
        run: swift test
      - name: Build release artifact
        run: ./Scripts/make-release.sh
      - name: Publish release with checksum
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          # Published immediately: the tag push is the deliberate act, and a
          # draft that still needs a click is a release that can be forgotten.
          files: |
            build/DragonWatch-*.zip
            build/DragonWatch-*.zip.sha256
          body: |
            Universal (Apple silicon + Intel), ad-hoc signed. macOS refuses
            the first launch: on macOS 15 or later open it once, then
            System Settings → Privacy & Security → **Open Anyway**; on
            macOS 14, right-click → Open. Or build from source with
            `./Scripts/make-app.sh`.

            Verify your download:
            ```sh
            shasum -a 256 -c DragonWatch-*.zip.sha256
            ```
