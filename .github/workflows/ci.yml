name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Lint
        run: swift format lint --strict --recursive Sources Tests
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Assemble app bundle
        run: ./Scripts/make-app.sh
